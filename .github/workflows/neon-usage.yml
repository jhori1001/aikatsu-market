name: Neon の使用量を見る

# Neon の API から、今の請求期間の使用量とおおよその料金を出す（scripts/neon_usage.py）。
# 読むだけ。DBそのものにはつながないので、使用量は増えない。
# このリポジトリは公開設定なので、GitHub Actions の無料枠も使わない。

on:
  # 毎朝の報告（Claude の予定タスク、7:43 JST）は、この定期実行の結果
  # （注記）を読む。予定タスクのセッションからは手動実行できない
  # （GitHub の認証が無い）ため。GitHub の定期実行は数時間遅れることがあるので、
  # 報告より十分前に置く
  schedule:
    - cron: "7 17 * * *"   # 2:07 JST（数時間遅れても朝の報告に間に合うように）
  workflow_dispatch:

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: 使用量を出す
        run: python3 scripts/neon_usage.py
