name: サイトのページを作り直す

# 公開ページは毎日の更新のあとに1回だけ作り、あとは作り置きを出す
# （カドソバの F2 と同じ、2026-11-05）。DBの中身を変えるワークフローは最後に
# 自動でこれと同じことをするが、手で作り直したいとき（デプロイ直後など）に使う。
# 自分のサイトにアクセスし、ページの一覧を作るためにDBのカード一覧を読むだけ（書き込まない）。
#
# 作り直しの前後で、作り置きが効いているか（x-vercel-cache）も表示する。
# 見るのは公開のアドレス kadosoba.com/aikatsu（日輪の Vercel がアイカツへ中継している）。

on:
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: 作り置きの状態（前）
        run: |
          for p in "" /cards /cards/E1-04_PR; do
            echo "=== $p"
            curl -s -o /dev/null -D - "https://kadosoba.com/aikatsu$p" | grep -i -E "^HTTP|x-vercel-cache|^age:|cache-control" || true
          done

      - name: 作り直す
        run: python -m app.jobs.revalidate_site

      - name: 作り置きの状態（後）
        run: |
          for p in "" /cards /cards/E1-04_PR; do
            for i in 1 2; do
              echo "=== $p ($i回目)"
              curl -s -o /dev/null -D - "https://kadosoba.com/aikatsu$p" | grep -i -E "^HTTP|x-vercel-cache|^age:|cache-control" || true
            done
          done

      # 公開の状態（2026-11-05 公開）。robots.txt（日輪が出している）にアイカツのサイトマップがあるか、
      # サイトマップの件数、ページに noindex が残っていないか、姉妹サイトのリンクがあるか
      - name: 公開の確認
        run: |
          echo "=== kadosoba.com/robots.txt"
          curl -s https://kadosoba.com/robots.txt
          echo
          echo "=== kadosoba.com/aikatsu/sitemap.xml の件数: $(curl -s https://kadosoba.com/aikatsu/sitemap.xml | grep -o '<loc>' | wc -l)"
          for u in https://kadosoba.com/aikatsu https://kadosoba.com/aikatsu/cards/E1-04_PR https://kadosoba.com/aikatsu/mylist https://kadosoba.com/; do
            html=$(curl -s "$u")
            echo "=== $u"
            echo "   noindex: $(echo "$html" | grep -o '<meta name="robots" content="[^"]*"' | head -1)"
            echo "   canonical: $(echo "$html" | grep -o '<link rel="canonical" href="[^"]*"' | head -1)"
            echo "   アナリティクス: $(echo "$html" | grep -o 'gtag/js?id=G-[A-Z0-9]*' | head -1)"
            echo "   題名: $(echo "$html" | grep -o '<title>[^<]*</title>' | head -1)"
            echo "   姉妹サイト: $(echo "$html" | grep -o 'footer-sister.\{0,200\}' | grep -o 'href="[^"]*"' | head -1)"
            echo "   上の帯: $(echo "$html" | grep -o 'sister-bar.\{0,120\}' | grep -o 'href="[^"]*"' | head -1)"
          done
