name: フルアヘッド（アイドル館）の下見

# fullahead-idol.com のアイカツ！アンコール一覧を、使ってよいか・どう読めるか
# 確かめるための手動ワークフロー（app/jobs/probe_fullahead.py）。
# 読み取りだけ。DBにはつながない・書かない。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: 下見（読み取りだけ）
        run: python -m app.jobs.probe_fullahead
