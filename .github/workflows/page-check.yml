name: 画面の疎通確認

# 本番と同じDBにつないでサイトを立ち上げ、ページのHTMLを取って、
# 想定した部品が出ているか数える手動ワークフロー（カドソバの page-check と同じ役目）。
# 読むだけで、DBには一切書き込まない。外部サイトへもアクセスしない。

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "開くページ（カンマ区切り）"
        required: false
        default: "/,/cards,/cards?sort=price_desc,/cards/E1-04_PR,/cards/E1-13_R"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: Asia/Tokyo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: サーバーを起動
        run: |
          npm run start -- --port 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/aikatsu/about -o /dev/null 2>/dev/null; then
              echo "起動しました"; exit 0
            fi
            sleep 2
          done
          echo "起動できませんでした"; cat /tmp/next.log; exit 1

      - name: 開いて数える
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          IFS=',' read -ra LIST <<< "$PATHS"
          for p in "${LIST[@]}"; do
            # サイトは basePath=/aikatsu（ホームの "/" は "/aikatsu"）
            u="$p"; [ "$u" = "/" ] && u=""
            code=$(curl -s -o /tmp/page.html -w "%{http_code}" "http://127.0.0.1:3000/aikatsu$u")
            echo "=== $p  status=$code  size=$(wc -c < /tmp/page.html)"
            for key in 'class="big-tile"' 'rank-carousel snap-one' 'more-tile' 'rank-row-more' \
                       'card-price shop' 'card-price"' 'card-price none' 'shop-ref shop-ref-aside' \
                       'shop-ref shop-ref-below' 'shop-ref-btn' 'ショップ参考価格' 'パラレル版' \
                       '販売中の平均' 'tone-status' '<th>種別</th>' '<th>状態</th>' 'データ無' 'idol-select' \
                       'badge parallel' 'PR★' 'ER★' 'auto-marquee-copy' 'パラレル版のカード' 'goods-section' 'hero-stat-value' 'Active' '停止中'; do
              n=$(grep -o "$key" /tmp/page.html | wc -l)
              echo "   $key: $n"
            done
            grep -o 'hero-stat-value">[^<]*' /tmp/page.html | sed 's/.*">/   数字: /' || true
            # basePath（/aikatsu）が付いているか。付いていない画像の道（src="/img…" など）は 0 のはず
            echo "   /aikatsu 付きの画像: $(grep -o 'src="/aikatsu/[^"]*' /tmp/page.html | wc -l) / 付いていない画像: $(grep -o -E 'src(Set)?="/(img|hero|goods|shops)' /tmp/page.html | wc -l)"
            grep -o -E '<link rel="canonical" href="[^"]*"|<meta property="og:image" content="[^"]*"' /tmp/page.html | head -2 | sed 's/^/   /' || true
            # 価格の並び（一覧の最初の8枚）
            grep -o 'card-price[^"]*"><span class="card-price-label">[^<]*</span>[^<]*' /tmp/page.html \
              | head -8 | sed 's/.*card-price-label">//; s#</span># #' | sed 's/^/   価格: /'
          done
          echo "=== サーバーのエラー"
          grep -i "error" /tmp/next.log | head -20 || true

      # 作り直しの合図（/api/revalidate）が通るか。鍵は DATABASE_URL のパスワードから作る
      # （backend/app/jobs/revalidate_site.py と frontend/src/app/api/revalidate/route.ts）。
      # 合図のあとも各ページが開けるかを見る。鍵が違うときは 403 になることも確かめる
      - name: 作り直しの合図を試す
        working-directory: backend
        env:
          SITE_URL: http://127.0.0.1:3000/aikatsu
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/aikatsu/api/revalidate -H 'x-revalidate-key: wrong')
          echo "鍵が違うとき: HTTP $code（403 なら正しい）"
          python3 -m app.jobs.revalidate_site --no-warm
          for path in "" /cards /mylist /cards/E1-04_PR /cards/E1-01_PR_p1 /cards/NO-SUCH_CARD /; do
            for i in 1 2; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -D /tmp/h.txt "http://127.0.0.1:3000/aikatsu$path")
              cache=$(grep -i '^x-nextjs-cache' /tmp/h.txt | tr -d '\r' || true)
              echo "合図のあと $path ($i回目): HTTP $code $cache"
            done
          done
