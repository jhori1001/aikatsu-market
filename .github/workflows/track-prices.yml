name: ER・PRカードの相場を記録する

# Yahoo!フリマの販売中の出品を、ER・PRカード(26枚)だけ記録して日次平均を
# 計算するワークフロー。アイカツ！アンコールは発売間もなく(2026-10-08〜)
# で件数も少ないため、カドソバのような成約価格の追跡（消えた出品を個別
# ページで確認する）はしない、ずっと軽い作り（app/jobs/track_prices.py）。
#
# robots.txt で禁止されている「売却済みだけに絞り込む検索」は使わない。
#
# 毎日自動で実行する（2026-10-29、手動実行のみだと2026-10-27のまま
# 止まっていたことが発覚したため常設化）。カドソバの日次更新(13:40 UTC)
# と時間が重ならないよう、少しずらして設定（毎時00分は世界中のジョブが
# 集中して遅れがちなので、それも避ける）。schedule起動時は
# inputs.dry_run が未定義（"true"と一致しない）になるので自動的に本番
# 保存になる。

on:
  schedule:
    # 16:13 UTC = 1:13 JST（カドソバの日次更新が終わった後の時間帯）
    - cron: "13 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "数えるだけ（保存しない）"
        type: boolean
        required: false
        default: true
      code:
        description: "対象を1枚に絞る（official_code、例: E1-78_PR / 空なら全ER・PR）"
        required: false
        default: ""

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: マイグレーション（sale_listings / daily_prices）
        run: python -m alembic upgrade head

      - name: 相場を記録する
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ inputs.code }}" ]; then
            ARGS="$ARGS --code ${{ inputs.code }}"
          fi
          python -m app.jobs.track_prices $ARGS

      # サイトの作り置きのページを作り直させる（カドソバの F2 と同じ、2026-11-05）。
      # 公開ページは毎日の更新のあとに1回だけ作り、あとは作り置きを出す形なので、
      # DBの中身を変えたらここで作り直しの合図を送り、全ページを1回ずつ開く。
      # 数えるだけ（dry_run）や、反映しない（apply=false）ときは流さない。
      # 失敗しても、ページは前の作り置きのまま出続ける（壊れはしない）。
      - name: サイトのページを作り直す
        if: ${{ !cancelled() && inputs.dry_run != true && inputs.dry_run != 'true' && inputs.apply != false && inputs.apply != 'false' }}
        continue-on-error: true
        run: python -m app.jobs.revalidate_site
