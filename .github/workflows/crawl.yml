name: カードを取り込む

# 公式サイト(dcd.aikatsu.com)からカード一覧と画像を取り込み、図鑑用の
# cards / card_images を更新する。手動実行のみ（まだ自動の日次更新はない）。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "数えるだけ（保存しない）"
        required: false
        default: "true"
      skip_images:
        description: "画像は取らない（カード情報だけ）"
        required: false
        default: "false"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
      LOG_LEVEL: INFO
      CRAWLER_USER_AGENT: ${{ secrets.CRAWLER_UA }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: 取り込む
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          else
            ARGS=""
          fi
          if [ "${{ inputs.skip_images }}" = "true" ]; then
            ARGS="$ARGS --skip-images"
          fi
          python -m app.jobs.crawl $ARGS

      # サイトの作り置きのページを作り直させる（カドソバの F2 と同じ、2026-11-05）。
      # 公開ページは毎日の更新のあとに1回だけ作り、あとは作り置きを出す形なので、
      # DBの中身を変えたらここで作り直しの合図を送り、全ページを1回ずつ開く。
      # 数えるだけ（dry_run）や、反映しない（apply=false）ときは流さない。
      # 失敗しても、ページは前の作り置きのまま出続ける（壊れはしない）。
      - name: サイトのページを作り直す
        if: ${{ !cancelled() && format('{0}', inputs.dry_run) != 'true' && format('{0}', inputs.apply) != 'false' }}
        continue-on-error: true
        run: python -m app.jobs.revalidate_site
