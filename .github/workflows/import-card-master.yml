name: カード名・アイドル名を登録する

# backend/data/card_master_add.csv の内容をカードマスタへ流し込む手動ワークフロー。
# 公式HTMLには名前の文字が無いため、card-sheets で画像から読み取った結果をCSVに
# 起こしたものを流し込む。
#
# 外部サイトへは一切アクセスしない。自前DBを更新するだけ。

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "実際に書き込む（外すと確認だけ）"
        type: boolean
        required: false
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: 登録する
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python -m app.jobs.import_card_master --apply
          else
            python -m app.jobs.import_card_master
          fi

      - name: 結果を確かめる
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.config import settings

          eng = create_engine(settings.database_url)
          with eng.connect() as cx:
              row = cx.execute(text("""
                  select count(*) as total,
                         count(*) filter (where name is null) as 名前なし,
                         count(*) filter (where idol_name is null) as アイドル名なし
                    from cards where is_active is true
              """)).one()
              print(dict(row._mapping))
          PY

      # サイトの作り置きのページを作り直させる（カドソバの F2 と同じ、2026-11-05）。
      # 公開ページは毎日の更新のあとに1回だけ作り、あとは作り置きを出す形なので、
      # DBの中身を変えたらここで作り直しの合図を送り、全ページを1回ずつ開く。
      # 数えるだけ（dry_run）や、反映しない（apply=false）ときは流さない。
      # 失敗しても、ページは前の作り置きのまま出続ける（壊れはしない）。
      - name: サイトのページを作り直す
        if: ${{ !cancelled() && inputs.dry_run != true && inputs.dry_run != 'true' && inputs.apply != false && inputs.apply != 'false' }}
        continue-on-error: true
        run: python -m app.jobs.revalidate_site
