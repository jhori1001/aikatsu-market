name: DBマイグレーション

# 画面（Vercel）は master への push で即デプロイされるが、DBの構造を変える
# alembic は別に走らせないと「画面は新しいのにDBは古い」状態になる。
# マイグレーションのファイルが増えたら、その push で先に流す。

on:
  push:
    branches: [master]
    paths:
      - "backend/alembic/**"
      - "backend/app/models.py"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8

    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Python 3.12 を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 適用前のリビジョン
        run: alembic current

      - name: マイグレーション
        run: alembic upgrade head

      - name: 適用後のリビジョン
        run: alembic current
