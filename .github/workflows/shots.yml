name: 画面の写真を撮る（一時）

# 実DBに繋いだ状態で画面を確認するための一時ワークフロー。確認し終わったら削除する。
# ログにbase64で出す方式（ログ肥大化を避けるため1回の実行で1枚だけ撮る）。

on:
  workflow_dispatch:
    inputs:
      page:
        description: "撮る画面"
        required: true
        default: "home"
        type: choice
        options:
          - home
          - cards
          - detail

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm install --no-save playwright@1.64.1

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: サーバーを起動
        run: nohup npm run start > /tmp/next.log 2>&1 &

      - name: 起動待ち
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          cat /tmp/next.log || true

      - name: スクリーンショット
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const target = '${{ inputs.page }}';
            if (target === 'home') {
              await page.goto('http://localhost:3000/', { waitUntil: 'networkidle' });
              await page.screenshot({ path: '/tmp/shot.png' });
            } else if (target === 'cards') {
              await page.goto('http://localhost:3000/cards', { waitUntil: 'networkidle' });
              // fullPageだと113枚ぶんで数MBになりログに乗り切らないため、画面1枚ぶんだけ
              await page.screenshot({ path: '/tmp/shot.png' });
            } else {
              await page.goto('http://localhost:3000/cards', { waitUntil: 'networkidle' });
              await page.click('.card-tile');
              await page.waitForLoadState('networkidle');
              await page.screenshot({ path: '/tmp/shot.png', fullPage: true });
            }
            await browser.close();
          })();
          "

      - name: ログにbase64で出す
        run: |
          echo "===IMG_START==="
          base64 -w 400 /tmp/shot.png
          echo "===IMG_END==="
